version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: chatbot-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: chatbot-platform
    volumes:
      - mongodb_data:/data/db
    networks:
      - chatbot-network

  python-rag-service:
    build:
      context: ./python-rag-service
      dockerfile: Dockerfile
    container_name: chatbot-python-rag
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./python-rag-service/.env
    networks:
      - chatbot-network
    depends_on:
      - mongodb

  nextjs-app:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
    container_name: chatbot-nextjs
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./nextjs-app/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/chatbot-platform
      - PYTHON_RAG_SERVICE_URL=http://python-rag-service:8000
    networks:
      - chatbot-network
    depends_on:
      - mongodb
      - python-rag-service

volumes:
  mongodb_data:

networks:
  chatbot-network:
    driver: bridge
